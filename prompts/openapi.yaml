    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes inventories, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          type: string
          enum: [active, deleted]
          description: |
