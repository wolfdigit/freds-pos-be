        - phone
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string

    CustomerSearchResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 42

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          description: Stable whitelist account id (`acct-` + hex). Cart storage and cashierId use this.
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, staff]
    AuthStateResponse:
      type: object
      required: [expiresAt, storeSelected, user]
      properties:
        expiresAt:
          type: string
          format: date-time
        storeSelected:
          type: boolean
        storeName:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthLoginResponse:
      allOf:
        - $ref: '#/components/schemas/AuthStateResponse'
        - type: object
          required: [token, tokenType]
          properties:
            token:
              type: string
            tokenType:
              type: string
              example: Bearer
    StoreDto:
      type: object
      required: [name, inventoryLocationId, inventoryLocationName, returnedInventoryLocationId, returnedInventoryLocationName]
      properties:
        name:
          type: string
          example: 台北旗艦店
        isDefault:
          type: boolean
          default: false
        inventoryLocationId:
          type: string
          description: Location that holds this store's normal goods.
        inventoryLocationName:
          type: string
        returnedInventoryLocationId:
          type: string
          description: Location that holds this store's returned goods.
        returnedInventoryLocationName:
          type: string

    CreateStoreRequest:
      type: object
      required: [name, inventoryLocationId, returnedInventoryLocationId]
      properties:
        name:
          type: string
          example: 高雄巨蛋店
        inventoryLocationId:
          type: string
          description: Existing location for normal goods. May be the same as returnedInventoryLocationId.
        returnedInventoryLocationId:
          type: string
          description: Existing location for returned goods.

    UpdateStoreBindingRequest:
      type: object
      required: [inventoryLocationId, returnedInventoryLocationId]
      properties:
        inventoryLocationId:
          type: string
        returnedInventoryLocationId:
          type: string

    OAuthRole:
      type: string
      enum: [admin, staff]
      description: Access control role for Google OAuth accounts
      example: admin

    OAuthAccountDto:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          description: Stable whitelist account id. Checkout cashierId and per-account carts use this, not the Google sub.
          example: acct-0123456789abcdef0123456789abcdef
        email:
          type: string
          format: email
          example: fred@gmail.com
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          nullable: true
          example: 店長 Fred
          description: Stored display name. Blank or null means sessions and new cashier snapshots show the account email, not a Google profile name.
        note:
          type: string
          example: 系統最高管理員 / 總部
          description: Optional note / job title / shift info

    CreateOAuthAccountRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: clerk01@gmail.com
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          nullable: true
          description: Optional. Omit, null, or whitespace stores no display name. Longer than 128 characters is rejected.
          example: 王小美
        note:
          type: string
          example: 台北店早班店員

    UpdateOAuthAccountRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          nullable: true
          description: |
            Omit to leave the stored name unchanged. Null or whitespace clears it.
            A non-blank value is trimmed and must be at most 128 characters.
          example: 王小美
        note:
          type: string
          example: 台北店早班主管

