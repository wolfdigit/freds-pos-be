      properties:
        storeName:
          type: string
        productScope:
          $ref: '#/components/schemas/StoreProductScope'
        changed:
          type: integer
          description: Rows actually added plus rows actually removed.
        added:
          type: integer
        removed:
          type: integer
        listedTotal:
          type: integer

