          items:
            $ref: '#/components/schemas/PreOrderItem'
        note:
          type: string
        operatorName:
          type: string
        updatedAt:
          type: string
          format: date-time

    CreatePreOrderRequest:
      type: object
      properties:
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        orderDate:
          type: string
        expectedArrivalDate:
          type: string
        source:
          type: string
          enum: [in_store, website]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreOrderItem'
        note:
          type: string
        operatorName:
          type: string

    UpdatePreOrderRequest:
      type: object
      properties:
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        orderDate:
          type: string
        expectedArrivalDate:
          type: string
        status:
          $ref: '#/components/schemas/PreOrderStatus'
        source:
          type: string
          enum: [in_store, website]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreOrderItem'
        note:
          type: string
        operatorName:
          type: string

    MarkItemsArrivedRequest:
      type: object
