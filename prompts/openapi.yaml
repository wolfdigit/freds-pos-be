        phone:
          type: string
          description: Phone (電話/手機)
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
          description: Tier (等級：Retail, B, A, S)
        vipTierName:
          type: string
        totalSpent:
          type: integer
        note:
          type: string
          description: 備註
        createdAt:
          type: string
