openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.0.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter
    (`src/services/interfaces/`). Mockup currently uses localStorage adapters;
    the FastAPI backend implements these paths without changing UI.

    This file is the merged contract for implemented phases
    (products catalog, member catalog, and checkout). Inventory stays out.
    Preorder rows exist so checkout can record a pickup; there is no preorder authoring API.
    
    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - JSON is camelCase.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).
    - Auth is optional/dummy for this phase.

    Customer spending increments, nested preorders/orders, seed data,
    and delete UI are out of the current customer pass. Member reward
    points are not part of the catalog.
  contact:
    name: Fred's POS
servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI (planned)
  - url: /api/v1
    description: Relative (same origin)

tags:
  - name: products
    description: Product catalog and multi-location stock
  - name: customers
    description: Member catalog (profile CRUD, paged search)
  - name: checkout
    description: Recorded sales, stock movement, and preorder pickup

paths:
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      summary: Search products
      description: |
        Fuzzy search by barcode, SKU without dashes, product name, or brand.
        Maps to `IProductService.searchProducts`.
        Default sort: `sku ASC`.
        Keyword, scale, brand, and inStockOnly filters run in SQL (`WHERE`),
        not in Python after load.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inStockOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create product
      description: |
        Maps to `IProductService.createProduct`.
        Server assigns `id` as `prod-{uuid4}` (no dashes), computes `normalizedSku`,
        and always creates four stock rows at quantity `0` with fixed location names.
        Does not write `product_pre_order_pending` (response `preOrderPendingCount` is `0`).
        Initial / ongoing stock quantities use future inventory APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: |
        Maps to `IProductService.updateProduct`.
        Metadata only — does not mutate stock rows or `product_pre_order_pending`.
        On SKU change, server recomputes `normalizedSku`; duplicate SKU returns 409.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: |
        Maps to `ICustomerService.searchCustomers`.
        Also used for checkout phone bind (no `/customers/by-phone/{phone}`).
        Missing / empty `keyword` = no keyword filter.
        Keyword matches name (case-insensitive contains), non-null phone
        (substring, also against canonicalized query), or non-null email
        (case-insensitive contains).
        `vipTier` missing or `ALL` = no VIP filter; otherwise exact match.
        Filters, sort, and paging run in SQL (`WHERE` / `ORDER BY` / `LIMIT` /
        `OFFSET`), not in Python after load. Default sort: `name ASC`, then `id ASC`.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Name / phone / email fragment
        - name: vipTier
          in: query
          schema:
            $ref: '#/components/schemas/VipTierOrAll'
          description: Exact VIP filter, or `ALL`
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page index
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page length (max 100)
      responses:
        '200':
          description: Paged matching customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSearchResponse'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: |
        Maps to `ICustomerService.createCustomer`.
        Server assigns `id` as `cust-{uuid4}` (no dashes) stored as PK `id`,
        plus `createdAt` and `updatedAt` (ISO 8601). Always sets `totalSpent: 0`.
        Missing `vipTier` → `regular`. Derives `vipTierName` from `vipTier`.
        Does not accept client `id` / `createdAt` / `updatedAt` / `vipTierName` /
        `totalSpent`. Phone is optional: omit / `null` / whitespace / empty after
        canonicalize → SQL NULL. Non-null phone is stored canonical (strip spaces
        / hyphens / parentheses) and unique among non-null values. Email is
        optional: omit / `null` / whitespace → SQL NULL. Non-null email is
        trimmed, lowercased, validated, and unique among non-null values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          description: Duplicate phone or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              examples:
                duplicatePhone:
                  value:
                    code: CUSTOMER_PHONE_DUPLICATE
                    message: 手機號碼已存在
                duplicateEmail:
                  value:
                    code: CUSTOMER_EMAIL_DUPLICATE
                    message: 電子信箱已存在

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer profile
      description: |
        Maps to `ICustomerService.updateCustomer`.
        Profile only. Never mutates `totalSpent`. Bumps `updatedAt`.
        On `vipTier` change, response `vipTierName` follows the server map.
        `phone` and `email` may be `null` to clear. Duplicate non-null phone /
        non-null email → 409.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '409':
          description: Duplicate phone or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              examples:
                duplicatePhone:
                  value:
                    code: CUSTOMER_PHONE_DUPLICATE
                    message: 手機號碼已存在
                duplicateEmail:
                  value:
                    code: CUSTOMER_EMAIL_DUPLICATE
                    message: 電子信箱已存在
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete customer
      description: |
        Maps to `ICustomerService.deleteCustomer`. Hard-delete. API-only this
        phase (no FE delete control).
        `409` when a related order/preorder is unfinished (status is not
        `completed`, `refunded`, or `cancelled`). This catalog phase has no
        order/preorder tables, so `409` cannot fire yet.
        Terminal history is kept; later `customer_id` FKs `ON DELETE SET NULL`
        and must retain `customerName` / `customerPhone` snapshots.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '409':
          description: Unfinished order or preorder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: CUSTOMER_HAS_UNFINISHED_ORDERS
                message: 該會員尚有未完成訂單，無法刪除

  /checkout/orders:
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Record a checkout sale
      description: |
        Cashier id and name are copied from the current user.
        The client does not send them. Until staff login exists,
        that user is the demo cashier `staff-001` / `店長 Fred`.
        There is no invoice on the request or the response.
        Checkout does not accept `preOrderId` or `preOrderItemId`.
        Each tender uses the frontend fields: `type`, `name`, `amount`,
        `tenderedCash`, `changeAmount`, and `transactionRef`.
        `type` is `cash`, `credit_card`, `line_pay`, `bank_transfer`, or `cod`.
        `cod` is rejected with `422`.
        The `201` body is the order JSON. The server does not return HTML.
        The client composes the slip from those fields.

        `orderNumber` is `SO-YYYYMMDD-HHMMSS-####` in `Asia/Taipei`.
        `####` is the max suffix already stored for that second, plus 1.
        The per-second prefix is the concurrency control. There is no retry when two sales share a second.

        `X-Idempotency-Key` replays the stored order when the cashier and body match.
        A lookup before insert is not enough. On a unique conflict for that key,
        catch it, re-select the stored order, and apply the same replay rules.

        A return line's `productId` must equal the original sale line's `productId`.
        That check always runs. Catalog products are soft-deleted (`deleted`),
        so the sale line's product id is never cleared.
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: false
          schema:
            type: string
          description: |
            Optional. Same key, same cashier, and same body replays the stored order JSON.
            A different body or cashier is `409` `IDEMPOTENCY_CONFLICT`.
            On unique conflict, re-select and replay. Do not rely on a prior SELECT alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Recorded order JSON. No HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Return quantity, return customer, payment, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Invalid tender, branch, or points-discount flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
    get:
      tags: [checkout]
      operationId: getOrderHistory
      summary: Search recorded sales
      parameters:
        - in: query
          name: customerId
          schema: {type: string}
        - in: query
          name: orderNumber
          schema: {type: string}
          description: Exact `SO-YYYYMMDD-HHMMSS-####`
        - in: query
          name: productId
          schema: {type: string}
        - in: query
          name: keyword
          schema: {type: string}
        - in: query
          name: productKeyword
          schema: {type: string}
        - in: query
          name: startDate
          schema: {type: string, format: date-time}
        - in: query
          name: endDate
          schema: {type: string, format: date-time}
        - in: query
          name: minAmount
          schema: {type: integer}
        - in: query
          name: maxAmount
          schema: {type: integer}
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, partially_refunded, refunded, all]
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page of sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrderSearchResponse'
  /checkout/orders/{orderId}:
    get:
      tags: [checkout]
      operationId: getOrderById
      summary: Get one recorded sale
      parameters:
        - in: path
          name: orderId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    ProductNotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定商品
    CustomerNotFound:
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: CUSTOMER_NOT_FOUND
            message: 找不到指定的會員

  schemas:
    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_STOCK
        - PREORDER_QTY_EXCEEDED
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - PRODUCT_SKU_DUPLICATE
        - STORAGE_CORRUPTED
        - CUSTOMER_NOT_FOUND
        - CUSTOMER_PHONE_DUPLICATE
        - CUSTOMER_EMAIL_DUPLICATE
        - CUSTOMER_HAS_UNFINISHED_ORDERS
        - ORDER_NOT_FOUND
        - RETURN_QTY_EXCEEDED
        - INVALID_RETURN_CUSTOMER
        - IDEMPOTENCY_CONFLICT
        - INVALID_PAYMENT


    CreateOrderRequest:
      type: object
      description: |
        The client does not send `cashierId` or `cashierName`. The server copies
        them from the current user. Until staff login exists, that user is the
        demo cashier `staff-001` / `店長 Fred`. A body that still includes cashier
        fields is ignored.
      required: [items, shippingFee, payments]
      properties:
        customerId: {type: string}
        branchId:
          type: string
          enum: [branch-store, branch-online]
          default: branch-store
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        shippingFee: {type: integer, minimum: 0}
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentTender'
        note: {type: string}
    CreateOrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: {type: string}
        quantity: {type: integer}
        unitPrice: {type: integer, minimum: 0}
        isManualPrice: {type: boolean, default: false}
        priceDiffReason: {type: string}
        pointsDiscountApplied: {type: boolean, default: false}
        originalOrderId: {type: string}
        originalOrderItemId: {type: string}
        restock: {type: boolean}
        returnReason: {type: string}
    PaymentMethodType:
      type: string
      enum: [cash, credit_card, line_pay, bank_transfer, cod]
    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5
    CheckoutOrderItem:
      type: object
      required:
        - id
        - productId
        - sku
        - name
        - scale
        - brand
        - originalPrice
        - unitPrice
        - isManualPrice
        - quantity
        - subtotal
        - pointsDiscountApplied
        - pointsDiscountAmount
        - returnedQuantity
      properties:
        id: {type: string}
        productId:
          type: string
          description: Catalog id. Remains set because products are soft-deleted.
        sku: {type: string}
        name: {type: string}
        scale:
          $ref: '#/components/schemas/ModelScale'
        brand: {type: string}
        originalPrice: {type: integer}
        unitPrice: {type: integer}
        isManualPrice: {type: boolean}
        priceDiffReason: {type: string}
        quantity: {type: integer}
        subtotal: {type: integer}
        pointsDiscountApplied: {type: boolean}
        pointsDiscountAmount: {type: integer}
        returnedQuantity: {type: integer}
        originalOrderId: {type: string}
        originalOrderItemId: {type: string}
        restock: {type: boolean}
        returnReason: {type: string}
    CheckoutOrder:
      type: object
      description: |
        Recorded sale. `cashierId` and `cashierName` are snapshots of the current
        user (`id`, `name`), not values from the request. Until staff login exists,
        that user is the demo cashier `staff-001` / `店長 Fred`.
        There is no invoice and no `costPrice`.
        These fields are what the client uses to compose the slip.
      required:
        - id
        - orderNumber
        - branchId
        - branchName
        - cashierId
        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - pointsDiscountAmount
        - shippingFee
        - totalAmount
        - payments
        - createdAt
        - updatedAt
      properties:
        id: {type: string}
        orderNumber:
          type: string
          description: '`SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. Sequence is per second.'
          example: SO-20261011-014430-0001
        branchId:
          type: string
          enum: [branch-store, branch-online]
        branchName: {type: string, example: 台北旗艦店}
        cashierId: {type: string}
        cashierName: {type: string}
        status:
          type: string
          enum: [completed, partially_refunded, refunded]
        customerId: {type: [string, 'null']}
        customerName: {type: [string, 'null']}
        customerPhone: {type: [string, 'null']}
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        itemsSubtotal: {type: integer}
        discountAmount: {type: integer}
        pointsDiscountAmount: {type: integer}
        shippingFee: {type: integer}
        totalAmount: {type: integer}
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTender'
        note: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CheckoutReceipt:
      type: object
      description: |
        JSON only. The server does not return HTML.
        The client composes the slip from `order.branchName`, `order.orderNumber`,
        `order.cashierName`, `order.createdAt`, each item `name` / `quantity` /
        `unitPrice` / `subtotal`, `order.shippingFee`, `order.payments`, and
        `order.totalAmount`.
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/CheckoutOrder'
    CheckoutOrderSearchResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrder'
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    StockLocation:
      type: string
      enum: [store, warehouse, company, other]

    LocationStock:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer

    ProductStatus:
      type: string
      enum: [active, discontinued]

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - stocks
        - totalStock
        - preOrderPendingCount
        - status
        - deleted
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
        costPrice:
          type: integer
        vipPrice:
          type: integer
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
        totalStock:
          type: integer
        preOrderPendingCount:
          type: integer
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        deleted:
          type: boolean
          description: |
            Soft-delete flag. Create stores `false`.
            `PUT /products/{productId}` sets it: `true` hides the product, `false` shows it again.
            The row is not removed. There is no `DELETE /products/{productId}`.
            `GET /products` omits `deleted: true`. `GET /products/{productId}` still returns it.
            A new sale rejects a hidden product. A return may still use that `productId`.

    CreateProductRequest:
      type: object
      required:
        - sku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - status
      properties:
        sku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
        costPrice:
          type: integer
          minimum: 0
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes stocks, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
        costPrice:
          type: integer
          minimum: 0
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        deleted:
          type: boolean
          description: |
            `true` hides the product from search and from a new sale.
            `false` shows it again. Does not remove the row.

    VipTier:
      type: string
      enum: [regular, silver, gold, platinum]

    VipTierOrAll:
      oneOf:
        - $ref: '#/components/schemas/VipTier'
        - type: string
          const: ALL

    Customer:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - vipTier
        - vipTierName
        - totalSpent
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Server-assigned PK (`cust-{uuid4}` without dashes)
        name:
          type: string
        phone:
          type: [string, 'null']
          description: |
            Optional. Always present on the response. Unique among non-null
            values after canonicalize. JSON `null` when unset.
        email:
          type: [string, 'null']
          format: email
          description: |
            Optional. Always present on the response. Unique among non-null
            values after trim + lowercase. JSON `null` when unset.
        vipTier:
          $ref: '#/components/schemas/VipTier'
        vipTierName:
          type: string
          description: |
            Derived on read, not stored.
            platinum 白金黑卡 (9折); gold 金卡會員 (95折);
            silver 銀卡會員 (98折); regular 一般會員
        totalSpent:
          type: integer
          minimum: 0
          description: Server-owned after create; catalog create always 0
        note:
          type: string
          description: Optional string. Omit or empty. Not JSON null.
        createdAt:
          type: string
          format: date-time
          description: Server-assigned ISO 8601
        updatedAt:
          type: string
          format: date-time
          description: Server-assigned ISO 8601; bump on profile update

    CustomerSearchResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Filtered row count (not just this page)

    CreateCustomerRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        phone:
          type: [string, 'null']
          description: |
            Optional. Omit / null / whitespace / empty after canonicalize →
            SQL NULL. Unique among non-null canonical values.
        email:
          type: [string, 'null']
          format: email
          description: Optional. Omit / null / whitespace → SQL NULL
        vipTier:
          $ref: '#/components/schemas/VipTier'
          description: Optional; omit → regular
        note:
          type: string
          description: Optional string. Omit or empty. Not JSON null.

    UpdateCustomerRequest:
      type: object
      description: |
        Partial profile update. Excludes id, createdAt, updatedAt,
        vipTierName, totalSpent. phone and email may be null to clear.
      properties:
        name:
          type: string
        phone:
          type: [string, 'null']
          description: Omit to leave unchanged; null clears to SQL NULL
        email:
          type: [string, 'null']
          format: email
          description: Omit to leave unchanged; null clears to SQL NULL
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string
          description: Optional string. Omit to leave unchanged; empty string is valid.
