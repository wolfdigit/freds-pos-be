openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.1.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter (`src/services/interfaces/`).
    Designed for high-performance model car specialty stores with unified checkout, multi-location stock,
    item-level returns/exchanges, pre-order partial fulfillment, and cash drawer management.

    **Core Architectural Principles**
    - **Single Transaction Pipeline**: All sales, returns, and defect exchanges are unified under `POST /checkout/orders`.
    - **Backend Pricing & Calculation Authority**: Frontend transmits purchase/return intents and cashier-adjusted `unitPrice`; backend calculates all line subtotals, discounts, taxes, and total amounts.
    - **Line-Item Return Traceability**: Returns/exchanges (negative quantities) must reference `originalOrderId` and `originalOrderItemId`, with cumulative `returnedQuantity` tracking.
    - **ACID Atomicity**: Checkout/return operations execute inside a single database transaction (locking store stock, updating pre-orders, updating customer spending, and creating orders).
    - **Idempotency**: `POST /checkout/orders` supports `X-Idempotency-Key` to prevent double-charging or double stock deduction.
    - **Authentication**: Cashier and branch identity are resolved from JWT Bearer tokens, bound at cashier login.

    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).

    **Kept on top of the frontend contract**
    - Products use `status` (`active` or `deleted`) to record soft delete. `deleted` mirrors that state. `GET /products` omits `status: deleted`. There is no product `costPrice`.
    - Checkout keeps `branchId` / `branchName`, points-discount fields, order number `SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei, and a paged `GET /checkout/orders`.
    - `POST /checkout/orders` returns `receiptPrintHtml`.
    - Payment types are `cash`, `credit_card`, `line_pay`, `bank_transfer`, and `cod`. `cod` is accepted.

servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI Backend
  - url: /api/v1
    description: Relative (same origin)

security:
  - BearerAuth: []

tags:
  - name: products
    description: Product catalog, multi-location stock, and transfers
  - name: checkout
    description: Sales orders, receipts, item-level returns and exchanges
  - name: preorders
    description: Customer pre-orders and arrival management
  - name: customers
    description: Members and VIP tiers
  - name: system
    description: System configurations, store branches, and Google OAuth access control whitelist

paths:
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      description: |
        Fuzzy search by barcode, SKU without dashes (normalized), product name, or brand.
        Maps to `IProductService.searchProducts`.
        Default sort: `sku ASC`.
        Omits products with `status: deleted`. `GET /products/{productId}` still returns a hidden row.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inStockOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      description: |
        Maps to `IProductService.createProduct`.
        Server assigns `id` as `prod-{uuid4}` (no dashes), computes `normalizedSku`,
        and always creates four stock rows at quantity `0` with fixed location names.
        Does not write `product_pre_order_pending` (response `preOrderPendingCount` is `0`).
        Initial / ongoing stock quantities use the inventory APIs.
        `status` is optional. When omitted, the server stores `active` and `deleted: false`. The body has no `costPrice`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: |
        Maps to `IProductService.updateProduct`.
        Metadata only — does not mutate stock rows or `product_pre_order_pending`.
        On SKU change, server recomputes `normalizedSku`; duplicate SKU returns 409.
        `status: deleted` or `deleted: true` hides the product. `status: active` or `deleted: false` shows it again. The row is not removed. If both are sent, `status` wins.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /inventory/transfers:
    post:
      tags: [products]
      operationId: transferStock
      summary: Transfer stock between locations
      description: |
        Maps to `IProductService.transferStock`. Executes atomically: deducts from `fromLocation` and adds to `toLocation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransferRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/adjustments:
    post:
      tags: [products]
      operationId: adjustStock
      summary: Manually set quantity at a location
      description: Maps to `IProductService.adjustStock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
      responses:
        '200':
          description: Adjustment succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/batch-adjustments:
    post:
      tags: [products]
      operationId: batchAdjustStock
      summary: Batch adjust stock quantities and log operation history
      description: Maps to `IProductService.batchAdjustStock`. Writes inventory updates and audit log atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStockAdjustRequest'
      responses:
        '200':
          description: Batch adjustment succeeded and logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

  /inventory/adjustments/logs:
    get:
      tags: [products]
      operationId: getStockAdjustmentLogs
      summary: Get stock adjustment history logs
      description: Maps to `IProductService.getStockAdjustmentLogs`.
      responses:
        '200':
          description: Stock adjustment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAdjustmentLog'

  /inventory/locations:
    get:
      tags: [products]
      operationId: getLocations
      summary: Get all stock locations
      description: |
        Maps to `ILocationService.getLocations`. Retrieves all active stock locations in the system.
      responses:
        '200':
          description: List of stock locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLocationDto'
    post:
      tags: [products]
      operationId: createLocation
      summary: Create a new stock location
      description: |
        Maps to `ILocationService.createLocation`. Adds a new custom inventory location to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStockLocationRequest'
      responses:
        '201':
          description: Created stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocationDto'

  /inventory/locations/{locationId}:
    put:
      tags: [products]
      operationId: updateLocation
      summary: Update a stock location
      description: |
        Maps to `ILocationService.updateLocation`. Updates name, icon, display order, or active state of a location.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockLocationRequest'
      responses:
        '200':
          description: Updated stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocationDto'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [products]
      operationId: deleteLocation
      summary: Delete a stock location and migrate its inventory
      description: |
        Maps to `ILocationService.deleteLocation`. Removes the specified location from active stock locations
        and atomically transfers all existing inventory quantities from this location to `transferToLocation`.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStockLocationRequest'
      responses:
        '200':
          description: Location deleted and stock migrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStockLocationResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders:
    get:
      tags: [checkout]
      operationId: getOrderHistory
      summary: List checkout orders
      description: |
        Maps to `ICheckoutService.getOrderHistory`. Supports searching by customer, order number,
        product ID (for finding original sales order during return), date range, or keyword.
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
          description: Filter by customer ID
        - name: orderNumber
          in: query
          schema:
            type: string
          description: Filter by exact or partial order number
        - name: productId
          in: query
          schema:
            type: string
          description: Filter orders containing this product (used for counter return lookup)
        - name: keyword
          in: query
          schema:
            type: string
          description: Search by customer phone, name, or order number
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, partially_refunded, refunded]
        - name: productKeyword
          in: query
          schema:
            type: string
        - name: minAmount
          in: query
          schema:
            type: integer
        - name: maxAmount
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged order list (newest-first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrderSearchResponse'
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Create checkout order (Sales, Exchanges, and Returns)
      description: |
        Maps to `ICheckoutService.createCheckoutOrder`.

        **Backend Atomic Lifecycle (Single DB Transaction)**:
        1. **Identity & Branch Resolution**: Extract `cashierId`, `cashierName`, and active `storeId` from `BearerAuth` JWT token.
        2. **Item Pricing & Subtotals**:
           - For positive purchases: verify `unitPrice` against `listPrice` or customer `vipPrice` unless `isManualPrice: true` (which requires `priceDiffReason`).
           - For pre-order items: verify `unitPrice` matches `quotedPrice` and `quantity <= qtyArrived - qtyDelivered`.
           - For return/exchange items (`quantity < 0`): verify `originalOrderId` & `originalOrderItemId`, ensuring `abs(quantity) <= (qtySold - qtyReturned)`. Also enforce member ownership: if the checkout is bound to customer A, the original order cannot belong to customer B (`customerId` mismatch raises `INVALID_RETURN_CUSTOMER`; unattached guest original orders are permitted).
           - Compute `subtotal = unitPrice * quantity` for each line.
        3. **Order Total**:
           - `itemsSubtotal = sum(subtotals)`
           - `discountAmount = sum((originalPrice - unitPrice) * quantity)`
           - Calculate final `totalAmount = itemsSubtotal + shippingFee`.
           - Validate `sum(payments.amount) == totalAmount` (or `payments >= totalAmount` with cash change).
        4. **Inventory & Pre-Order Atomicity**:
           - Positive items: lock and deduct `store` stock with row lock (`WHERE quantity >= :qty`).
           - Negative items: if `restock: true`, increment `store` stock; increment `returnedQuantity` on original order.
           - Pre-order items: increment `qtyDelivered` and update pre-order status.
        5. **Member Asset Update**:
           - Update `customer.totalSpent += totalAmount`
        6. **Receipt & Persistence**:
           - Persist `CheckoutOrder` and return `CheckoutReceipt` with thermal print HTML.
           - `orderNumber` is `SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. `####` is the max suffix for that second, plus 1. There is no retry when two sales share a second.
           - Points discount is already inside the line `unitPrice`. The server also stores `pointsDiscountApplied` and `pointsDiscountAmount` (360). It does not subtract 360 again.
           - A positive line rejects `deleted: true` with `PRODUCT_NOT_FOUND`. A return may still use that product id.
           - On an idempotency unique conflict, catch it, re-select, and replay. Do not rely on a lookup before insert.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Optional. Same key, same cashier, and same body replays the stored receipt.
            A different body or cashier is `409` `IDEMPOTENCY_CONFLICT`.
            On unique conflict, re-select and replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
      responses:
        '201':
          description: Order created with receipt HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders/{orderId}:
    get:
      tags: [checkout]
      operationId: getOrderById
      summary: Get order by ID (reprint receipt / check return status)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders:
    get:
      tags: [preorders]
      operationId: getPendingPreOrders
      summary: Search open pre-orders
      description: |
        Maps to `IPreOrderService.getPendingPreOrders`.
        Matches customer phone, name, or order number. Excludes `completed` and `cancelled`.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Phone fragment, name, or order number (e.g. `0912`)
      responses:
        '200':
          description: Matching open pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'
    post:
      tags: [preorders]
      operationId: createPreOrder
      summary: Create pre-order
      description: Maps to `IPreOrderService.createPreOrder`. Server assigns `id`, `orderNumber`, `status`, and `updatedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'

  /customers/{customerId}/preorders:
    get:
      tags: [preorders]
      operationId: getPreOrdersByCustomerId
      summary: List pre-orders for a customer
      description: Maps to `IPreOrderService.getPreOrdersByCustomerId` (all statuses).
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'

  /preorders/{preOrderId}:
    get:
      tags: [preorders]
      operationId: getPreOrderById
      summary: Get pre-order by ID
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      responses:
        '200':
          description: Pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [preorders]
      operationId: updatePreOrder
      summary: Update pre-order information
      description: Maps to `IPreOrderService.updatePreOrder`.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreOrderRequest'
      responses:
        '200':
          description: Updated pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders/{preOrderId}/arrived:
    post:
      tags: [preorders]
      operationId: markItemsArrived
      summary: Mark pre-order items arrived (Phase 2)
      description: Updates `qtyArrived` for specified products and re-derives pre-order status.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkItemsArrivedRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders/{preOrderId}/fulfill:
    post:
      tags: [preorders]
      operationId: fulfillPreOrderItems
      summary: Fulfill pre-order items
      description: Deducts fulfilled quantities for specific items in a pre-order.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfilledItems]
              properties:
                fulfilledItems:
                  type: array
                  items:
                    type: object
                    required: [preOrderItemId, qty]
                    properties:
                      preOrderItemId:
                        type: string
                      qty:
                        type: integer
      responses:
        '200':
          description: Fulfill succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: Maps to `ICustomerService.searchCustomers`. Empty query returns all with pagination.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Phone, name, or email for fuzzy matching
        - name: vipTier
          in: query
          schema:
            type: string
            enum: [ALL, Retail, B, A, S]
          description: Filter by VIP tier or ALL
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
          description: Items per page
      responses:
        '200':
          description: Customers list or paginated response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerSearchResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: Maps to `ICustomerService.createCustomer`. Server assigns `id` and `createdAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer information
      description: Maps to `ICustomerService.updateCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Maps to `ICustomerService.deleteCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{customerId}/spending:
    post:
      tags: [customers]
      operationId: updateCustomerSpending
      summary: Update customer total spending
      description: Maps to `ICustomerService.updateCustomerSpending`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: Spent amount in TWD
      responses:
        '200':
          description: Customer spending updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores:
    get:
      tags: [system]
      operationId: getStores
      summary: Get all store branches
      description: |
        Retrieves all configured store branches (登入門市清單).
      responses:
        '200':
          description: List of store branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreDto'
    post:
      tags: [system]
      operationId: createStore
      summary: Add a new store branch
      description: |
        Adds a new store branch to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Created store branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/stores/{storeName}:
    delete:
      tags: [system]
      operationId: deleteStore
      summary: Delete a store branch
      description: |
        Removes a store branch from the system. System requires at least one store branch to remain active.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
          description: Name of the store branch to delete
      responses:
        '200':
          description: Store branch deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deletedStore:
                    type: string
                    example: 台中一中店
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/oauth/accounts:
    get:
      tags: [system]
      operationId: getOAuthAccounts
      summary: Get Google OAuth authorized accounts whitelist
      description: |
        Retrieves all authorized Google accounts for admin and staff roles, including display names, roles, and notes.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OAuthRole'
          description: Optional filter by role (`admin` or `staff`)
      responses:
        '200':
          description: List of authorized OAuth accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthAccountDto'
    post:
      tags: [system]
      operationId: createOAuthAccount
      summary: Add an authorized Google OAuth account
      description: |
        Adds a new authorized Google account to the whitelist with role, display name, and optional note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthAccountRequest'
      responses:
        '201':
          description: Created OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/oauth/accounts/{email}:
    put:
      tags: [system]
      operationId: updateOAuthAccount
      summary: Update an authorized Google OAuth account
      description: |
        Updates the display name, note, or role of an existing authorized Google OAuth account.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthAccountRequest'
      responses:
        '200':
          description: Updated OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [system]
      operationId: deleteOAuthAccount
      summary: Remove a Google OAuth account from whitelist
      description: |
        Removes an authorized Google account from the whitelist.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address to remove
      responses:
        '200':
          description: Account removed from whitelist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deletedEmail:
                    type: string
                    example: clerk01@gmail.com
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated cashier / store staff token containing cashierId, name, and active store branch.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      example: so-2001
    PreOrderId:
      name: preOrderId
      in: path
      required: true
      schema:
        type: string
      example: po-1001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定資源
    BusinessError:
      description: Business rule failed (no partial writes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          examples:
            insufficientStock:
              value:
                code: INSUFFICIENT_STORE_STOCK
                message: 門市現貨不足，請先從倉庫調撥
            returnQty:
              value:
                code: RETURN_QTY_EXCEEDED
                message: 退貨數量超過原單剩餘可退上限
            payment:
              value:
                code: PAYMENT_INSUFFICIENT
                message: 支付總額不足

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_STOCK
        - RETURN_QTY_EXCEEDED
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - PRODUCT_SKU_DUPLICATE
        - ORDER_NOT_FOUND
        - LOCATION_NOT_FOUND
        - INVALID_LOCATION_TRANSFER
        - TARGET_LOCATION_NOT_FOUND
        - STORAGE_CORRUPTED
        - CUSTOMER_NOT_FOUND
        - CUSTOMER_PHONE_DUPLICATE
        - CUSTOMER_EMAIL_DUPLICATE
        - CUSTOMER_HAS_UNFINISHED_ORDERS
        - INVALID_RETURN_CUSTOMER
        - IDEMPOTENCY_CONFLICT
        - PREORDER_QTY_EXCEEDED

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    StockLocation:
      type: string
      description: Stock location identifier (UUID or default location identifier)
      example: e1a10002-0000-4000-8000-000000000002

    StockLocationDto:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Unique Primary Key (UUID)
          example: e1a10001-0000-4000-8000-000000000001
        name:
          type: string
          example: 後方倉庫
        icon:
          type: string
          example: 📦
        isDefault:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 1
        isActive:
          type: boolean
          default: true

    CreateStockLocationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: 高雄巨蛋門市
        icon:
          type: string
          example: 🏬
        displayOrder:
          type: integer
        isActive:
          type: boolean
          default: true

    UpdateStockLocationRequest:
      type: object
      properties:
        name:
          type: string
          example: 門市展示區
        icon:
          type: string
          example: 🏪
        displayOrder:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true

    DeleteStockLocationRequest:
      type: object
      required: [transferToLocation]
      properties:
        transferToLocation:
          $ref: '#/components/schemas/StockLocation'
        reason:
          type: string
          example: 撤點整併至後方倉庫

    DeleteStockLocationResponse:
      type: object
      required: [success, deletedLocation, transferredToLocation, affectedProductsCount, totalQuantityTransferred]
      properties:
        success:
          type: boolean
          example: true
        deletedLocation:
          type: string
          example: store_2
        transferredToLocation:
          type: string
          example: warehouse
        affectedProductsCount:
          type: integer
          example: 15
        totalQuantityTransferred:
          type: integer
          example: 42
        message:
          type: string
          example: 成功刪除地點並將 15 項商品共 42 台庫存轉移至後方倉庫

    LocationStock:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - listPrice
        - stocks
        - totalStock
        - deleted
        - status
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
        totalStock:
          type: integer
        note:
          type: string
        createdAt:
          type: string
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員 (後端由 Auth 取得)
        updatedAt:
          type: string
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員 (後端由 Auth 取得)
        status:
          type: string
          enum: [active, deleted]
          description: |
            Soft-delete record. Create stores `active`.
            `deleted` hides the product from `GET /products` and from a new sale.
            `active` shows it again. The row is not removed.
            `GET /products/{productId}` still returns a hidden product.
        deleted:
          type: boolean
          description: |
            Mirrors `status`. `true` when `status` is `deleted`, otherwise `false`.

    CreateProductRequest:
      type: object
      required:
        - sku
        - barcode
        - brand
        - name
        - listPrice
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          type: string
          enum: [active, deleted]
          description: Soft-delete record. Omit it and the server stores `active`.

    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes stocks, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          type: string
          enum: [active, deleted]
          description: |
            `deleted` hides the product. `active` shows it again. Does not remove the row.
        deleted:
          type: boolean
          description: |
            Same meaning as `status`. `true` hides the product. `false` shows it again.
            If `status` is also sent, `status` wins.

    InventoryTransferRequest:
      type: object
      required: [productId, fromLocation, toLocation, quantity]
      properties:
        productId:
          type: string
        fromLocation:
          $ref: '#/components/schemas/StockLocation'
        toLocation:
          $ref: '#/components/schemas/StockLocation'
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
        operatorId:
          type: string

    StockAdjustRequest:
      type: object
      required: [productId, location, newQuantity, reason]
      properties:
        productId:
          type: string
        location:
          $ref: '#/components/schemas/StockLocation'
        newQuantity:
          type: integer
          minimum: 0
        reason:
          type: string

    BatchStockAdjustRequest:
      type: object
      required: [adjustments, operatorName, timestamp]
      properties:
        operatorName:
          type: string
        timestamp:
          type: string
        note:
          type: string
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'

    StockLocationChange:
      type: object
      required: [location, locationName, oldQty, newQty, diff]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
        oldQty:
          type: integer
        newQty:
          type: integer
        diff:
          type: integer

    StockItemAdjustment:
      type: object
      required: [productId, sku, name, brand, changes, summaryText]
      properties:
        productId:
          type: string
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        brand:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/StockLocationChange'
        summaryText:
          type: string

    StockAdjustmentLog:
      type: object
      required: [id, timestamp, operatorName, items, totalQtyChange]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        operatorName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'
        totalQtyChange:
          type: integer
        note:
          type: string

    PaymentMethodType:
      type: string
      enum: [cash, credit_card, line_pay, bank_transfer, cod]

    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5

    CheckoutOrderItem:
      type: object
      required:
        - id
        - productId
        - sku
        - name
        - brand
        - originalPrice
        - unitPrice
        - isManualPrice
        - quantity
        - subtotal
        - pointsDiscountApplied
        - pointsDiscountAmount
        - returnedQuantity
      properties:
        id:
          type: string
        productId:
          type: string
          description: Catalog id. Remains set because products are soft-deleted.
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        originalPrice:
          type: integer
        unitPrice:
          type: integer
          description: 結帳成交單價
        isManualPrice:
          type: boolean
        priceDiffReason:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        subtotal:
          type: integer
        pointsDiscountApplied:
          type: boolean
        pointsDiscountAmount:
          type: integer
        note:
          type: string
          description: 項目備註
        returnedQuantity:
          type: integer
          description: Cumulative quantity returned against this line item
          default: 0
        originalOrderId:
          type: string
        originalOrderItemId:
          type: string
        restock:
          type: boolean
          default: true
        returnReason:
          type: string

    OrderStatus:
      type: string
      enum: [completed, partially_refunded, refunded]

    CheckoutOrder:
      type: object
      required:
        - id
        - orderNumber
        - branchId
        - branchName
        - cashierId
        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - pointsDiscountAmount
        - shippingFee
        - totalAmount
        - payments
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          description: '`SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. Sequence is per second.'
          example: SO-20261011-014430-0001
        branchId:
          type: string
          enum: [branch-store, branch-online]
        branchName:
          type: string
          example: 台北旗艦店
        cashierId:
          type: string
        cashierName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
