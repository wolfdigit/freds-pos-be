        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        orderDate:
          type: string
        expectedArrivalDate:
          type: string
        source:
          type: string
          enum: [in_store, website]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreOrderItem'
