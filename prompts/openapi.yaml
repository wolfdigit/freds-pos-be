      description: >
        Payment type on POST /checkout/orders (sales and refunds) and on stored
        orders. A migration converts legacy `credit_card` to `credit_card_physical`
        and `bank_transfer` to `bank_transfer_ctbc`.
      enum: [cash, bank_transfer_ctbc, bank_transfer_ubot, credit_card_physical, credit_card_online, line_pay, cod]

    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5

    CheckoutOrderItem:
      type: object
      required:
        - id
        - productId
        - sku
        - name
        - brand
        - originalPrice
        - unitPrice
        - isManualPrice
        - quantity
        - subtotal
        - pointsDiscountApplied
        - returnedQuantity
      properties:
        id:
          type: string
        productId:
          type: string
          description: Catalog id. Remains set because products are soft-deleted.
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        originalPrice:
          type: integer
        unitPrice:
          type: integer
          description: 結帳成交單價
        isManualPrice:
          type: boolean
        priceDiffReason:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        subtotal:
          type: integer
        pointsDiscountApplied:
          type: boolean
          description: 此列使用點數折抵（只存旗標，金額 = (originalPrice - unitPrice) × quantity）。退貨列沿用原列旗標。
        preorderPickup:
          type: boolean
          default: false
          description: 預購取貨。這一列的庫存從門市的預購保留地點扣，不從門市庫存扣。只會出現在銷售列。
        note:
          type: string
          description: 項目備註
        returnedQuantity:
          type: integer
          description: Cumulative quantity returned against this line item
          default: 0
        originalOrderId:
          type: string
        originalOrderItemId:
          type: string
        restock:
          type: boolean
          default: true
        returnReason:
          type: string
        inventoryLocationId:
          type: string
          description: Location this line changed. A return sets the normal location when `restock` is omitted or true, and the returned location when `restock` is false.
        inventoryLocationName:
          type: string

    OrderStatus:
      type: string
      enum: [completed, partially_refunded, refunded]

    CheckoutOrder:
      type: object
      required:
        - id
        - orderNumber
        - branchId
        - branchName
        - cashierId
        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - pointsDiscountAmount
        - shippingFee
        - totalAmount
        - payments
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          description: '`SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. Sequence is per second.'
          example: SO-20261011-014430-0001
        branchId:
          type: string
          description: Login store recorded on the order. Not an inventory location. Older rows may still be `branch-store` or `branch-online`.
          example: 奇可門市
        branchName:
          type: string
          example: 奇可門市
        cashierId:
          type: string
        cashierName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        itemsSubtotal:
          type: integer
        discountAmount:
          type: integer
          description: 折讓 = Σ(originalPrice - unitPrice) × quantity，只算手動改價且沒有點數旗標的列。
        pointsDiscountAmount:
          type: integer
          description: 點數折抵 = Σ(originalPrice - unitPrice) × quantity，算有點數旗標的列的全部差額（即使也手動改價）。由明細計算，不另存。
        shippingFee:
          type: integer
        totalAmount:
          type: integer
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員

    CreateOrderItemPayload:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        unitPrice:
          type: integer
          description: Cashier-set unit price (re-validated by server unless isManualPrice is true)
        isManualPrice:
          type: boolean
          default: false
        priceDiffReason:
          type: string
        pointsDiscountApplied:
          type: boolean
          default: false
        preorderPickup:
          type: boolean
          default: false
          description: 預購取貨：從登入門市的預購保留地點扣庫存。只能用在銷售列（quantity > 0），退貨列送 true 會回 422。可以和點數折抵同時使用。
        originalOrderId:
          type: string
          description: Required when quantity < 0 (links return to original sales order)
        originalOrderItemId:
          type: string
          description: Required when quantity < 0 (links return to original item line)
        restock:
          type: boolean
          default: true
          description: For returns. Omitted or true adds the quantity to the login store's normal location. false adds it to the returned location. A return always changes quantity.
        returnReason:
          type: string
        note:
          type: string

    CreateOrderPayload:
      type: object
      required: [items, payments]
      properties:
        customerId:
          type: string
        branchId:
          type: string
          description: Ignored. Order attribution comes from the session's login store. Stock location is unchanged.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemPayload'
        shippingFee:
          type: integer
          default: 0
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string

    CheckoutReceipt:
