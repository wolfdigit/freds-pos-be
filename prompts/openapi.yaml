          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員 (後端由 Auth 取得)
        updatedAt:
          type: string
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員 (後端由 Auth 取得)

    CreateCustomerRequest:
      type: object
      required:
