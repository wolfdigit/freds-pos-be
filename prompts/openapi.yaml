openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.0.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter
    (`src/services/interfaces/`). Mockup currently uses localStorage adapters;
    the FastAPI backend implements these paths without changing UI.

    This file is the merged contract for implemented / in-scope phases
    (products catalog + member catalog). Do not add checkout, inventory, or
    preorder paths until those phases start.

    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - JSON is camelCase.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).
    - Auth is optional/dummy for this phase.

    Customer spending increments, nested preorders/orders, seed data,
    add-points UI, and delete UI are out of the current customer pass.
  contact:
    name: Fred's POS
servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI (planned)
  - url: /api/v1
    description: Relative (same origin)

tags:
  - name: products
    description: Product catalog and multi-location stock
  - name: customers
    description: Member catalog (profile CRUD, search, cashier point adjust)

paths:
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      summary: Search products
      description: |
        Fuzzy search by barcode, SKU without dashes, product name, or brand.
        Maps to `IProductService.searchProducts`.
        Default sort: `sku ASC`.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inStockOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create product
      description: |
        Maps to `IProductService.createProduct`.
        Server assigns `id` as `prod-{uuid4}` (no dashes), computes `normalizedSku`,
        and always creates four stock rows at quantity `0` with fixed location names.
        Does not write `product_pre_order_pending` (response `preOrderPendingCount` is `0`).
        Initial / ongoing stock quantities use future inventory APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: |
        Maps to `IProductService.updateProduct`.
        Metadata only — does not mutate stock rows or `product_pre_order_pending`.
        On SKU change, server recomputes `normalizedSku`; duplicate SKU returns 409.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: |
        Maps to `ICustomerService.searchCustomers`.
        Missing / empty `keyword` = no keyword filter.
        Keyword matches name (case-insensitive contains), phone (substring, also
        against canonicalized query), or email (case-insensitive contains).
        `vipTier` missing or `ALL` = no VIP filter; otherwise exact match.
        `minPoints` missing = no points filter; otherwise `rewardPoints >= minPoints`.
        Filters are AND-combined. Default sort: `name ASC`.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Name / phone / email fragment
        - name: vipTier
          in: query
          schema:
            $ref: '#/components/schemas/VipTierOrAll'
          description: Exact VIP filter, or `ALL`
        - name: minPoints
          in: query
          schema:
            type: integer
            minimum: 0
          description: Keep members with rewardPoints >= this value
      responses:
        '200':
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: |
        Maps to `ICustomerService.createCustomer`.
        Server assigns `id` as `cust-{uuid4}` (no dashes) stored as PK `id`,
        and `createdAt` (ISO 8601). Always sets `totalSpent: 0`.
        Missing `vipTier` → `regular`. Derives `vipTierName` from `vipTier`.
        Missing `rewardPoints` → `0`.
        Does not accept client `id` / `createdAt` / `vipTierName` / `totalSpent`.
        Phone is stored canonical (strip spaces / hyphens / parentheses).
        Email is trimmed, lowercased, and required unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          description: Duplicate phone or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              examples:
                duplicatePhone:
                  value:
                    code: CUSTOMER_PHONE_DUPLICATE
                    message: 手機號碼已存在
                duplicateEmail:
                  value:
                    code: CUSTOMER_EMAIL_DUPLICATE
                    message: 電子信箱已存在

  /customers/by-phone/{phone}:
    get:
      tags: [customers]
      operationId: getCustomerByPhone
      summary: Get customer by exact phone
      description: |
        Maps to `ICustomerService.getCustomerByPhone` (checkout member bind).
        Server canonicalizes the path phone before exact lookup.
        Distinct from `/customers/{customerId}` (ids are `cust-…`).
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          example: '0912-345-678'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer profile
      description: |
        Maps to `ICustomerService.updateCustomer`.
        Profile only. `rewardPoints` **replaces** the stored balance.
        Never mutates `totalSpent`. On `vipTier` change, response `vipTierName`
        follows the server map. Cannot clear email. Duplicate phone/email → 409.
        To add/subtract points, use `POST /customers/{customerId}/reward-points`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '409':
          description: Duplicate phone or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              examples:
                duplicatePhone:
                  value:
                    code: CUSTOMER_PHONE_DUPLICATE
                    message: 手機號碼已存在
                duplicateEmail:
                  value:
                    code: CUSTOMER_EMAIL_DUPLICATE
                    message: 電子信箱已存在
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete customer
      description: |
        Maps to `ICustomerService.deleteCustomer`. Hard-delete. API-only this
        phase (no FE delete control).
        `409` when a related order/preorder is unfinished (status is not
        `completed`, `refunded`, or `cancelled`). This catalog phase has no
        order/preorder tables, so `409` cannot fire yet.
        Terminal history is kept; later `customer_id` FKs `ON DELETE SET NULL`
        and must retain `customerName` / `customerPhone` snapshots.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '409':
          description: Unfinished order or preorder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: CUSTOMER_HAS_UNFINISHED_ORDERS
                message: 該會員尚有未完成訂單，無法刪除

  /customers/{customerId}/reward-points:
    post:
      tags: [customers]
      operationId: addRewardPoints
      summary: Add or subtract reward points
      description: |
        Maps to `ICustomerService.addRewardPoints`.
        `amount` is a signed integer (positive adds, negative subtracts).
        `newBalance = stored + amount`. If `newBalance < 0`, deny with 422
        `CUSTOMER_POINTS_INSUFFICIENT` (do not clamp). `amount: 0` is a no-op
        (`200` + current Customer).
        PUT `rewardPoints` remains replace. Checkout later owns sale-time
        earned/used points.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRewardPointsRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          description: Resulting balance would be negative, or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: CUSTOMER_POINTS_INSUFFICIENT
                message: 點數不足

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    ProductNotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定商品
    CustomerNotFound:
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: CUSTOMER_NOT_FOUND
            message: 找不到指定的會員

  schemas:
    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_STOCK
        - PREORDER_QTY_EXCEEDED
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - PRODUCT_SKU_DUPLICATE
        - STORAGE_CORRUPTED
        - CUSTOMER_NOT_FOUND
        - CUSTOMER_PHONE_DUPLICATE
        - CUSTOMER_EMAIL_DUPLICATE
        - CUSTOMER_HAS_UNFINISHED_ORDERS
        - CUSTOMER_POINTS_INSUFFICIENT

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    StockLocation:
      type: string
      enum: [store, warehouse, company, other]

    LocationStock:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer

    ProductStatus:
      type: string
      enum: [active, discontinued]

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - stocks
        - totalStock
        - preOrderPendingCount
        - status
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
        costPrice:
          type: integer
        vipPrice:
          type: integer
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
        totalStock:
          type: integer
        preOrderPendingCount:
          type: integer
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    CreateProductRequest:
      type: object
      required:
        - sku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - status
      properties:
        sku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
        costPrice:
          type: integer
          minimum: 0
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes stocks, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
        costPrice:
          type: integer
          minimum: 0
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    VipTier:
      type: string
      enum: [regular, silver, gold, platinum]

    VipTierOrAll:
      oneOf:
        - $ref: '#/components/schemas/VipTier'
        - type: string
          const: ALL

    Customer:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - vipTier
        - vipTierName
        - rewardPoints
        - totalSpent
        - createdAt
      properties:
        id:
          type: string
          description: Server-assigned PK (`cust-{uuid4}` without dashes)
        name:
          type: string
        phone:
          type: string
          description: Unique; stored canonical
        email:
          type: string
          format: email
          description: Required; unique after trim + lowercase
        vipTier:
          $ref: '#/components/schemas/VipTier'
        vipTierName:
          type: string
          description: |
            Derived on read, not stored.
            platinum 白金黑卡 (9折); gold 金卡會員 (95折);
            silver 銀卡會員 (98折); regular 一般會員
        rewardPoints:
          type: integer
          minimum: 0
        totalSpent:
          type: integer
          minimum: 0
          description: Server-owned after create; catalog create always 0
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Server-assigned ISO 8601

    CreateCustomerRequest:
      type: object
      required:
        - name
        - phone
        - email
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
          description: Optional; omit → regular
        note:
          type: string
        rewardPoints:
          type: integer
          minimum: 0
          description: Optional; omit → 0. Sets the initial balance.

    UpdateCustomerRequest:
      type: object
      description: |
        Partial profile update. Excludes id, createdAt, vipTierName, totalSpent.
        Sent email must remain a valid unique address (cannot clear).
        rewardPoints replaces the stored balance.
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string
        rewardPoints:
          type: integer
          minimum: 0
          description: Replaces the stored balance when sent

    AddRewardPointsRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          description: Signed. Positive adds, negative subtracts.
