openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.1.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter (`src/services/interfaces/`).
    Designed for high-performance model car specialty stores with unified checkout, multi-location stock,
    item-level returns/exchanges, pre-order partial fulfillment, and cash drawer management.

    **Core Architectural Principles**
    - **Single Transaction Pipeline**: All sales, returns, and defect exchanges are unified under `POST /checkout/orders`.
    - **Backend Pricing & Calculation Authority**: Frontend transmits purchase/return intents and cashier-adjusted `unitPrice`; backend calculates all line subtotals, discounts, taxes, and total amounts.
    - **Line-Item Return Traceability**: Returns/exchanges (negative quantities) must reference `originalOrderId` and `originalOrderItemId`, with cumulative `returnedQuantity` tracking.
    - **ACID Atomicity**: Checkout/return operations execute inside a single database transaction (locking store stock, updating customer spending, and creating orders). Checkout does not update pre-orders.
    - **Idempotency**: `POST /checkout/orders` supports `X-Idempotency-Key` to prevent double-charging or double stock deduction.
    - **Authentication**: `POST /auth/google` exchanges a Google ID token for a server session. Later calls send `Authorization: Bearer <session token>`. The selected login store chooses the normal and returned inventory locations used by checkout. Body `branchId` is ignored.

    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).

    **Kept on top of the frontend contract**
    - Products use `status` (`active` or `deleted`) to record soft delete. `deleted` mirrors that state. `GET /products` omits `status: deleted`. There is no product `costPrice`.
    - Checkout keeps `branchId` / `branchName`, points-discount fields, order number `SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei, and a paged `GET /checkout/orders`.
    - `POST /checkout/orders` returns `{ order }` with the calculated amounts. The client formats the slip.
    - Payment types are `cash`, `credit_card`, `line_pay`, `bank_transfer`, and `cod`. `cod` is accepted.

servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI Backend
  - url: /api/v1
    description: Relative (same origin)

security:
  - BearerAuth: []

tags:
  - name: products
    description: Product catalog, multi-location stock, and transfers
  - name: checkout
    description: Sales orders, receipts, item-level returns and exchanges
  - name: preorders
    description: Customer pre-orders and arrival management
  - name: customers
    description: Members and VIP tiers
  - name: auth
    description: Google sign-in, POS session, and store selection
  - name: system
    description: System configurations, store branches, and Google OAuth access control whitelist

paths:
  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Exchange a Google ID token for a POS session
      security: []
      description: |
        Send the Google Identity Services credential (ID token). The server checks signature, issuer,
        audience, expiry, and `email_verified`. The email must already exist in `oauth_account`.
        No account is created for an unknown email. Google `sub` is not stored.
        The session lasts 12 hours from this call and does not slide. A store is not selected yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: Google ID token. Do not send a client secret.
      responses:
        '200':
          description: "Session issued. Store the token and send it as Authorization Bearer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/BusinessError'
  /auth/stores:
    get:
      tags: [auth]
      operationId: listStoresForLogin
      summary: List stores before a store is selected
      description: Allowed with a session that has not selected a store. Does not expose other business APIs.
      responses:
        '200':
          description: Store names that can be selected
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreDto'
  /auth/store:
    post:
      tags: [auth]
      operationId: selectStore
      summary: Select or switch the session store
      description: |
        Does not require a new Google sign-in. Switching is allowed with a non-empty cart;
        the frontend warns and does not clear cart lines. The next order is attributed to this
        store and deducts that store's normal location. A return with `restock` omitted or
        `true` adds quantity at that normal location. `restock: false` adds it at the returned location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName]
              properties:
                storeName:
                  type: string
      responses:
        '200':
          description: Updated session state. The bearer token is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStateResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session only
      responses:
        '200':
          description: This token is revoked. Other devices stay signed in.
          content:
            application/json:
              schema:
                type: object
                required: [loggedOut]
                properties:
                  loggedOut:
                    type: boolean
  /auth/me:
    get:
      tags: [auth]
      operationId: currentSession
      summary: Current user, role, store, and expiry
      responses:
        '200':
          description: Session state without a new token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStateResponse'
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      description: |
        Fuzzy search by barcode, SKU without dashes (normalized), product name, or brand.
        Maps to `IProductService.searchProducts`.
        Default sort: `sku ASC`.
        Omits products with `status: deleted`. `GET /products/{productId}` still returns a hidden row.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inInventoryOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      description: |
        Maps to `IProductService.createProduct`.
        Server assigns `id` as `prod-{uuid4}` (no dashes), computes `normalizedSku`,
        and does not create inventory rows.
        Does not write `product_pre_order_pending` (response `preOrderPendingCount` is `0`).
        Initial and later quantities use the inventory APIs. `totalInventory` sums every location, including negatives.
        `status` is optional. When omitted, the server stores `active` and `deleted: false`. The body has no `costPrice`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: |
        Maps to `IProductService.updateProduct`.
        Metadata only — does not mutate stock rows or `product_pre_order_pending`.
        On SKU change, server recomputes `normalizedSku`; duplicate SKU returns 409.
        `status: deleted` or `deleted: true` hides the product. `status: active` or `deleted: false` shows it again. The row is not removed. If both are sent, `status` wins.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /inventory/transfers:
    post:
      tags: [products]
      operationId: transferStock
      summary: Transfer stock between locations
      description: |
        Maps to `IProductService.transferStock`. Executes atomically: deducts from `fromLocation` and adds to `toLocation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransferRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/transfers/all:
    post:
      tags: [products]
      operationId: moveAllStock
      summary: Move every bucket at one location to another
      description: |
        Moves every non-zero quantity at the source. A negative quantity moves too.
        The source location and its store bindings stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveAllStockRequest'
      responses:
        '200':
          description: Move succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/receipts:
    post:
      tags: [products]
      operationId: createInventoryReceipt
      summary: Receive stock into a location
      description: Adds quantity at the chosen location and keeps a receipt. Receipt lines are stock movements. It does not replace the current quantity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryReceiptRequest'
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [products]
      operationId: searchInventoryReceipts
      summary: List stock receipts
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Receipt page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReceiptPage'

  /inventory/movements:
    get:
      tags: [products]
      operationId: searchInventoryMovements
      summary: List stock movements
      parameters:
        - name: productId
          in: query
          schema:
            type: string
        - name: locationId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Movement page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementPage'

  /inventory/adjustments:
    post:
      tags: [products]
      operationId: adjustStock
      summary: Manually set quantity at a location
      description: Maps to `IProductService.adjustStock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustRequest'
      responses:
        '200':
          description: Adjustment succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/batch-adjustments:
    post:
      tags: [products]
      operationId: batchAdjustStock
      summary: Batch adjust stock quantities and log operation history
      description: Maps to `IProductService.batchAdjustStock`. Writes inventory updates and audit log atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInventoryAdjustRequest'
      responses:
        '200':
          description: Batch adjustment succeeded and logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

  /inventory/adjustments/logs:
    get:
      tags: [products]
      operationId: getInventoryAdjustmentLogs
      summary: Get stock adjustment history logs
      description: Maps to `IProductService.getInventoryAdjustmentLogs`.
      responses:
        '200':
          description: Stock adjustment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryAdjustmentLog'

  /inventory/locations:
    get:
      tags: [products]
      operationId: getLocations
      summary: Get all stock locations
      description: |
        Maps to `ILocationService.getLocations`. Retrieves all active stock locations in the system.
      responses:
        '200':
          description: List of stock locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryLocationDto'
    post:
      tags: [products]
      operationId: createLocation
      summary: Create a new stock location
      description: |
        Maps to `ILocationService.createLocation`. Adds a new custom inventory location to the system.
        `name` is trimmed, then limited to 64 characters. A longer name is a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryLocationRequest'
      responses:
        '201':
          description: Created stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocationDto'

  /inventory/locations/{locationId}:
    put:
      tags: [products]
      operationId: updateLocation
      summary: Update a stock location
      description: |
        Maps to `ILocationService.updateLocation`. Updates name, icon, or display order.
        A sent `name` is trimmed, then limited to 64 characters. A longer name is a validation error and the stored name stays unchanged.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryLocationRequest'
      responses:
        '200':
          description: Updated stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLocationDto'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [products]
      operationId: deleteLocation
      summary: Delete an empty inventory location
      description: |
        Refuses with `409` `LAST_LOCATION` when this is the only location.
        Refuses with `409` `LOCATION_NOT_EMPTY` when any quantity is not exactly zero. A negative quantity is not zero.
        Stores that used this location as their normal or returned location are bound to `rebindToLocation`. No new location is created.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteInventoryLocationRequest'
      responses:
        '200':
          description: Location deleted and its stores rebound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInventoryLocationResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders:
    get:
      tags: [checkout]
      operationId: getOrderHistory
      summary: List checkout orders
      description: |
        Maps to `ICheckoutService.getOrderHistory`. Supports searching by customer, order number,
        product ID (for finding original sales order during return), date range, or keyword.
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
          description: Filter by customer ID
        - name: orderNumber
          in: query
          schema:
            type: string
          description: Filter by exact or partial order number
        - name: productId
          in: query
          schema:
            type: string
          description: Filter orders containing this product (used for counter return lookup)
        - name: keyword
          in: query
          schema:
            type: string
          description: Search by customer phone, name, or order number
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, partially_refunded, refunded]
        - name: productKeyword
          in: query
          schema:
            type: string
        - name: minAmount
          in: query
          schema:
            type: integer
        - name: maxAmount
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged order list (newest-first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrderSearchResponse'
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Create checkout order (Sales, Exchanges, and Returns)
      description: |
        Maps to `ICheckoutService.createCheckoutOrder`.

        **Backend Atomic Lifecycle (Single DB Transaction)**:
        1. **Identity & Branch Resolution**: Require a session that already selected a `store_branch`. `cashierId` is the whitelist account id (`acct-...`), `cashierName` is the whitelist display name (or the email when that name is blank). `branchId` / `branchName` record that login store on the order. A body `branchId` is ignored. Stock comes from that store's two bound locations.
        2. **Item Pricing & Subtotals**:
           - For positive purchases: verify `unitPrice` against `listPrice` or customer `vipPrice` unless `isManualPrice: true` (which requires `priceDiffReason`).
           - For return/exchange items (`quantity < 0`): verify `originalOrderId` & `originalOrderItemId`, ensuring `abs(quantity) <= (qtySold - qtyReturned)`. Also enforce member ownership: if the checkout is bound to customer A, the original order cannot belong to customer B (`customerId` mismatch raises `INVALID_RETURN_CUSTOMER`; unattached guest original orders are permitted).
           - Checkout does not accept a pre-order id and does not check `quotedPrice`, `qtyArrived`, or `qtyDelivered`.
           - Compute `subtotal = unitPrice * quantity` for each line.
        3. **Order Total**:
           - `itemsSubtotal = sum(subtotals)`
           - `discountAmount = sum((originalPrice - unitPrice) * quantity)`
           - Calculate final `totalAmount = itemsSubtotal + shippingFee`.
           - Validate `sum(payments.amount) == totalAmount` (or `payments >= totalAmount` with cash change).
        4. **Inventory**:
           - Positive items deduct the login store's normal location (`inventoryLocationId`). The sale still completes when that quantity becomes negative.
           - Negative items always add `abs(quantity)`. `restock` omitted or `true` adds it to the login store's normal location (`inventoryLocationId`), so it can be sold again. `restock: false` adds it to the returned location (`returnedInventoryLocationId`). The line stores `inventoryLocationId` and `inventoryLocationName` for the location that changed.
           - Checkout does not change a pre-order. `qtyDelivered` and pre-order status change only on `POST /preorders/{preOrderId}/fulfill`.
        5. **Member Asset Update**:
           - Update `customer.totalSpent += totalAmount`
        6. **Receipt & Persistence**:
           - Persist `CheckoutOrder` and return `{ order }` with the calculated amounts. The client formats the slip.
           - `orderNumber` is `SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. `####` is the max suffix for that second, plus 1. There is no retry when two sales share a second.
           - Points discount is already inside the line `unitPrice`. The server also stores `pointsDiscountApplied` and `pointsDiscountAmount` (360). It does not subtract 360 again.
           - A positive line rejects `deleted: true` with `PRODUCT_NOT_FOUND`. A return may still use that product id.
           - On an idempotency unique conflict, catch it, re-select, and replay. Do not rely on a lookup before insert.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Optional. Same key, same cashier, and same body replays the stored receipt.
            A different body or cashier is `409` `IDEMPOTENCY_CONFLICT`.
            On unique conflict, re-select and replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
      responses:
        '201':
          description: Order created. The body is the calculated order only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders/{orderId}:
    get:
      tags: [checkout]
      operationId: getOrderById
      summary: Get order by ID (reprint receipt / check return status)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders:
    get:
      tags: [preorders]
      operationId: getPendingPreOrders
      summary: Search open pre-orders
      description: |
        Maps to `IPreOrderService.getPendingPreOrders`.
        Matches customer phone, name, or order number. Excludes `completed` and `cancelled`.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Phone fragment, name, or order number (e.g. `0912`)
      responses:
        '200':
          description: Matching open pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'
    post:
      tags: [preorders]
      operationId: createPreOrder
      summary: Create pre-order
      description: Maps to `IPreOrderService.createPreOrder`. Server assigns `id`, `orderNumber`, `status`, and `updatedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'

  /customers/{customerId}/preorders:
    get:
      tags: [preorders]
      operationId: getPreOrdersByCustomerId
      summary: List pre-orders for a customer
      description: Maps to `IPreOrderService.getPreOrdersByCustomerId` (all statuses).
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'

  /preorders/{preOrderId}:
    get:
      tags: [preorders]
      operationId: getPreOrderById
      summary: Get pre-order by ID
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      responses:
        '200':
          description: Pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [preorders]
      operationId: updatePreOrder
      summary: Update pre-order information
      description: Maps to `IPreOrderService.updatePreOrder`.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreOrderRequest'
      responses:
        '200':
          description: Updated pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders/{preOrderId}/arrived:
    post:
      tags: [preorders]
      operationId: markItemsArrived
      summary: Mark pre-order items arrived (Phase 2)
      description: Updates `qtyArrived` for specified products and re-derives pre-order status.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkItemsArrivedRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders/{preOrderId}/fulfill:
    post:
      tags: [preorders]
      operationId: fulfillPreOrderItems
      summary: Fulfill pre-order items
      description: Deducts fulfilled quantities for specific items in a pre-order.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfilledItems]
              properties:
                fulfilledItems:
                  type: array
                  items:
                    type: object
                    required: [preOrderItemId, qty]
                    properties:
                      preOrderItemId:
                        type: string
                      qty:
                        type: integer
      responses:
        '200':
          description: Fulfill succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: Maps to `ICustomerService.searchCustomers`. Empty query returns all with pagination.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Phone, name, or email for fuzzy matching
        - name: vipTier
          in: query
          schema:
            type: string
            enum: [ALL, Retail, B, A, S]
          description: Filter by VIP tier or ALL
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
          description: Items per page
      responses:
        '200':
          description: Customers list or paginated response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerSearchResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: Maps to `ICustomerService.createCustomer`. Server assigns `id` and `createdAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer information
      description: Maps to `ICustomerService.updateCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Maps to `ICustomerService.deleteCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{customerId}/spending:
    post:
      tags: [customers]
      operationId: updateCustomerSpending
      summary: Update customer total spending
      description: Maps to `ICustomerService.updateCustomerSpending`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: Spent amount in TWD
      responses:
        '200':
          description: Customer spending updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores:
    get:
      tags: [system]
      operationId: getStores
      summary: Get all store branches
      description: |
        Admin-only management list. Staff retrieve choices from `GET /auth/stores`.
        `PUT /system/stores/{storeName}` changes the two location bindings.
        There is no set-default route. `isDefault` is informational.
      responses:
        '200':
          description: List of store branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreDto'
    post:
      tags: [system]
      operationId: createStore
      summary: Add a new store branch
      description: |
        Admin only. A signed-in admin may create the first store before selecting one.
        Staff receive `403` `AUTH_FORBIDDEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Created store branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/stores/{storeName}:
    put:
      tags: [system]
      operationId: rebindStore
      summary: Update a store's inventory locations
      description: |
        Admin only. Sets both the normal and returned locations. They may be the same location. Quantity stays where it is.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreBindingRequest'
      responses:
        '200':
          description: Store rebound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [system]
      operationId: deleteStore
      summary: Delete a store branch
      description: |
        Admin only. The last remaining store cannot be deleted (`409` `LAST_STORE`).
        Staff receive `403` `AUTH_FORBIDDEN`. A missing name is `404` `LOCATION_NOT_FOUND`.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
          description: Name of the store branch to delete
      responses:
        '200':
          description: Store branch deleted
          content:
            application/json:
              schema:
                type: object
                required: [deletedStore]
                properties:
                  deletedStore:
                    type: string
                    example: 台中一中店
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Last store cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: LAST_STORE
                message: 至少要保留一間門市

  /system/oauth/accounts:
    get:
      tags: [system]
      operationId: getOAuthAccounts
      summary: Get Google OAuth authorized accounts whitelist
      description: |
        Retrieves all authorized Google accounts for admin and staff roles, including display names, roles, and notes.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OAuthRole'
          description: Optional filter by role (`admin` or `staff`)
      responses:
        '200':
          description: List of authorized OAuth accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthAccountDto'
    post:
      tags: [system]
      operationId: createOAuthAccount
      summary: Add an authorized Google OAuth account
      description: |
        Adds a new authorized Google account to the whitelist with role, display name, and optional note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthAccountRequest'
      responses:
        '201':
          description: Created OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/oauth/accounts/{email}:
    put:
      tags: [system]
      operationId: updateOAuthAccount
      summary: Update an authorized Google OAuth account
      description: |
        Updates the display name, note, or role of an existing authorized Google OAuth account.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthAccountRequest'
      responses:
        '200':
          description: Updated OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [system]
      operationId: deleteOAuthAccount
      summary: Remove a Google OAuth account from whitelist
      description: |
        Removes an authorized Google account from the whitelist.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address to remove
      responses:
        '200':
          description: Account removed from whitelist
          content:
            application/json:
              schema:
                type: object
                required: [deletedEmail]
                properties:
                  deletedEmail:
                    type: string
                    example: clerk01@gmail.com
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "POS session token from POST /auth/google. Not the Google ID token. Send it as Authorization Bearer."

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      example: so-2001
    PreOrderId:
      name: preOrderId
      in: path
      required: true
      schema:
        type: string
      example: po-1001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定資源
    BusinessError:
      description: Business rule failed (no partial writes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          examples:
            insufficientStock:
              value:
                code: INSUFFICIENT_INVENTORY
                message: 調出地點庫存不足
            returnQty:
              value:
                code: RETURN_QTY_EXCEEDED
                message: 退貨數量超過原單剩餘可退上限
            payment:
              value:
                code: PAYMENT_INSUFFICIENT
                message: 支付總額不足

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_INVENTORY
        - INSUFFICIENT_INVENTORY
        - LOCATION_NOT_EMPTY
        - LAST_LOCATION
        - LOCATION_NAME_TAKEN
        - INVENTORY_LOCATION_IN_USE
        - RETURN_QTY_EXCEEDED
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - PRODUCT_SKU_DUPLICATE
        - ORDER_NOT_FOUND
        - LOCATION_NOT_FOUND
        - INVALID_LOCATION_TRANSFER
        - TARGET_LOCATION_NOT_FOUND
        - STORAGE_CORRUPTED
        - CUSTOMER_NOT_FOUND
        - CUSTOMER_PHONE_DUPLICATE
        - CUSTOMER_EMAIL_DUPLICATE
        - CUSTOMER_HAS_UNFINISHED_ORDERS
        - INVALID_RETURN_CUSTOMER
        - IDEMPOTENCY_CONFLICT
        - PREORDER_QTY_EXCEEDED
        - AUTH_REQUIRED
        - AUTH_NOT_CONFIGURED
        - AUTH_PROVIDER_UNAVAILABLE
        - AUTH_INVALID_CREDENTIAL
        - AUTH_ACCOUNT_NOT_ALLOWED
        - AUTH_FORBIDDEN
        - AUTH_SESSION_EXPIRED
        - AUTH_SESSION_REVOKED
        - AUTH_STORE_REQUIRED
        - AUTH_STORE_INVALID
        - ACCOUNT_ROLE_INVALID
        - ACCOUNT_LAST_ADMIN
        - LAST_STORE
        - ACCOUNT_SELF_PROTECTED
        - ACCOUNT_NAME_REQUIRED

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    InventoryLocation:
      type: string
      description: Stock location identifier (UUID or default location identifier)
      example: e1a10002-0000-4000-8000-000000000002

    InventoryLocationDto:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Unique Primary Key (UUID)
          example: e1a10001-0000-4000-8000-000000000001
        name:
          type: string
          example: 後方倉庫
        icon:
          type: string
          example: 📦
        isDefault:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 1
        storeNames:
          type: array
          items:
            type: string
          readOnly: true
          description: Stores that use this location for normal goods.
        returnedStoreNames:
          type: array
          items:
            type: string
          readOnly: true
          description: Stores that use this location for returned goods.

    CreateInventoryLocationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          description: Trimmed before the length check. At most 64 characters.
          example: 高雄巨蛋門市
        icon:
          type: string
          example: 🏬
        displayOrder:
          type: integer

    UpdateInventoryLocationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          description: Trimmed before the length check. At most 64 characters. Omit to leave the stored name unchanged.
          example: 門市展示區
        icon:
          type: string
          example: 🏪
        displayOrder:
          type: integer
          example: 1

    DeleteInventoryLocationRequest:
      type: object
      properties:
        rebindToLocation:
          type: string
          description: |
            Required when any store is bound to the location being deleted.
            Must be a different existing location. Those stores are bound to it.

    DeleteInventoryLocationResponse:
      type: object
      required: [deletedLocation, reboundStoreNames]
      properties:
        deletedLocation:
          type: string
        reboundStoreNames:
          type: array
          items:
            type: object
            required: [name, binding, inventoryLocationId]
            properties:
              name:
                type: string
              binding:
                type: string
                enum: [normal, returned]
              inventoryLocationId:
                type: string

    LocationInventory:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/InventoryLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer
          description: Quantity at this location. May be negative. A missing row is 0.

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - listPrice
        - inventories
        - totalInventory
        - loginStoreQuantity
        - loginStoreReturnedQuantity
        - deleted
        - status
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
        inventories:
          type: array
          items:
            $ref: '#/components/schemas/LocationInventory'
        totalInventory:
          type: integer
          description: Sum of quantity at every location, including warehouses, returned locations, and negatives.
        loginStoreQuantity:
          type: integer
          description: Quantity at the session store's normal location. `0` when that row is missing.
        loginStoreReturnedQuantity:
          type: integer
          description: Quantity at the session store's returned location. `0` when that row is missing.
        note:
          type: string
        createdAt:
          type: string
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員 (後端由 Auth 取得)
        updatedAt:
          type: string
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員 (後端由 Auth 取得)
        status:
          type: string
          enum: [active, deleted]
          description: |
            Soft-delete record. Create stores `active`.
            `deleted` hides the product from `GET /products` and from a new sale.
            `active` shows it again. The row is not removed.
            `GET /products/{productId}` still returns a hidden product.
        deleted:
          type: boolean
          description: |
            Mirrors `status`. `true` when `status` is `deleted`, otherwise `false`.

    CreateProductRequest:
      type: object
      required:
        - sku
        - barcode
        - brand
        - name
        - listPrice
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          type: string
          enum: [active, deleted]
          description: Soft-delete record. Omit it and the server stores `active`.

    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes inventories, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          type: string
          enum: [active, deleted]
          description: |
            `deleted` hides the product. `active` shows it again. Does not remove the row.
        deleted:
          type: boolean
          description: |
            Same meaning as `status`. `true` hides the product. `false` shows it again.
            If `status` is also sent, `status` wins.

    InventoryTransferRequest:
      type: object
      required: [productId, fromLocation, toLocation, quantity]
      properties:
        productId:
          type: string
        fromLocation:
          $ref: '#/components/schemas/InventoryLocation'
        toLocation:
          $ref: '#/components/schemas/InventoryLocation'
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string

    MoveAllStockRequest:
      type: object
      required: [fromLocation, toLocation]
      properties:
        fromLocation:
          type: string
        toLocation:
          type: string
        reason:
          type: string

    CreateInventoryReceiptRequest:
      type: object
      required: [locationId, items]
      properties:
        locationId:
          type: string
        note:
          type: string
        supplier:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1

    InventoryReceipt:
      type: object
      required: [id, locationId, locationName, operatorName, createdAt, items, totalQuantity]
      properties:
        id:
          type: string
        locationId:
          type: string
        locationName:
          type: string
        supplier:
          type: string
        note:
          type: string
        operatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [productId, sku, name, quantity]
            properties:
              productId:
                type: string
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
        totalQuantity:
          type: integer

    InventoryReceiptPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryReceipt'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    InventoryMovement:
      type: object
      required: [id, type, productId, locationId, quantityDelta, quantityAfter, sourceId, operatorName, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        productId:
          type: string
        sku:
          type: string
          description: Present on receipt lines.
        name:
          type: string
          description: Present on receipt lines.
        locationId:
          type: string
        quantityDelta:
          type: integer
        quantityAfter:
          type: integer
        reason:
          type: string
        sourceId:
          type: string
        operatorName:
          type: string
        createdAt:
          type: string
          format: date-time

    InventoryMovementPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryMovement'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    InventoryAdjustRequest:
      type: object
      required: [productId, location, newQuantity, reason]
      properties:
        productId:
          type: string
        location:
          $ref: '#/components/schemas/InventoryLocation'
        newQuantity:
          type: integer
          description: Absolute quantity. May be negative.
        reason:
          type: string
          description: Required. Blank text is rejected.

    BatchInventoryAdjustRequest:
      type: object
      required: [adjustments, note]
      properties:
        operatorName:
          type: string
          description: Ignored. The server uses the logged-in operator.
        timestamp:
          type: string
          description: Ignored. The server uses its own clock.
        note:
          type: string
          description: Required. Blank text is rejected.
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemAdjustment'

    InventoryLocationChange:
      type: object
      required: [location, locationName, oldQty, newQty, diff]
      properties:
        location:
          $ref: '#/components/schemas/InventoryLocation'
        locationName:
          type: string
        oldQty:
          type: integer
        newQty:
          type: integer
        diff:
          type: integer

    InventoryItemAdjustment:
      type: object
      required: [productId, sku, name, brand, changes, summaryText]
      properties:
        productId:
          type: string
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        brand:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocationChange'
        summaryText:
          type: string

    InventoryAdjustmentLog:
      type: object
      required: [id, timestamp, operatorName, items, totalQtyChange]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        operatorName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemAdjustment'
        totalQtyChange:
          type: integer
        note:
          type: string

    PaymentMethodType:
      type: string
      enum: [cash, credit_card, line_pay, bank_transfer, cod]

    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5

    CheckoutOrderItem:
      type: object
      required:
        - id
        - productId
        - sku
        - name
        - brand
        - originalPrice
        - unitPrice
        - isManualPrice
        - quantity
        - subtotal
        - pointsDiscountApplied
        - pointsDiscountAmount
        - returnedQuantity
      properties:
        id:
          type: string
        productId:
          type: string
          description: Catalog id. Remains set because products are soft-deleted.
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        originalPrice:
          type: integer
        unitPrice:
          type: integer
          description: 結帳成交單價
        isManualPrice:
          type: boolean
        priceDiffReason:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        subtotal:
          type: integer
        pointsDiscountApplied:
          type: boolean
        pointsDiscountAmount:
          type: integer
        note:
          type: string
          description: 項目備註
        returnedQuantity:
          type: integer
          description: Cumulative quantity returned against this line item
          default: 0
        originalOrderId:
          type: string
        originalOrderItemId:
          type: string
        restock:
          type: boolean
          default: true
        returnReason:
          type: string
        inventoryLocationId:
          type: string
          description: Location this line changed. A return sets the normal location when `restock` is omitted or true, and the returned location when `restock` is false.
        inventoryLocationName:
          type: string

    OrderStatus:
      type: string
      enum: [completed, partially_refunded, refunded]

    CheckoutOrder:
      type: object
      required:
        - id
        - orderNumber
        - branchId
        - branchName
        - cashierId
        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - pointsDiscountAmount
        - shippingFee
        - totalAmount
        - payments
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          description: '`SO-YYYYMMDD-HHMMSS-####` in Asia/Taipei. Sequence is per second.'
          example: SO-20261011-014430-0001
        branchId:
          type: string
          description: Login store recorded on the order. Not an inventory location. Older rows may still be `branch-store` or `branch-online`.
          example: 奇可門市
        branchName:
          type: string
          example: 奇可門市
        cashierId:
          type: string
        cashierName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        itemsSubtotal:
          type: integer
        discountAmount:
          type: integer
        pointsDiscountAmount:
          type: integer
        shippingFee:
          type: integer
        totalAmount:
          type: integer
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員

    CreateOrderItemPayload:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        unitPrice:
          type: integer
          description: Cashier-set unit price (re-validated by server unless isManualPrice is true)
        isManualPrice:
          type: boolean
          default: false
        priceDiffReason:
          type: string
        pointsDiscountApplied:
          type: boolean
          default: false
        originalOrderId:
          type: string
          description: Required when quantity < 0 (links return to original sales order)
        originalOrderItemId:
          type: string
          description: Required when quantity < 0 (links return to original item line)
        restock:
          type: boolean
          default: true
          description: For returns. Omitted or true adds the quantity to the login store's normal location. false adds it to the returned location. A return always changes quantity.
        returnReason:
          type: string
        note:
          type: string

    CreateOrderPayload:
      type: object
      required: [items, payments]
      properties:
        customerId:
          type: string
        branchId:
          type: string
          description: Ignored. Order attribution comes from the session's login store. Stock location is unchanged.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemPayload'
        shippingFee:
          type: integer
          default: 0
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string

    CheckoutReceipt:
      type: object
      required: [order]
      description: Calculated order only. Receipt layout is not part of this response.
      properties:
        order:
          $ref: '#/components/schemas/CheckoutOrder'

    CheckoutOrderSearchResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrder'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PreOrderStatus:
      type: string
      enum:
        - pending
        - partially_arrived
        - partially_completed
        - completed
        - cancelled

    PreOrderItem:
      type: object
      required:
